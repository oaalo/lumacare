name: Live Groq smoke test
on:
  push:
    branches: [codex/grounded-ai-chat]
    paths:
      - scripts/live-smoke.mjs
      - .github/workflows/live-smoke.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Test real Groq responses without logging credentials
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: node scripts/live-smoke.mjs
