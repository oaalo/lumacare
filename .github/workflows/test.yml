name: Test LATYAI
on:
  push:
    branches: ["codex/grounded-ai-chat"]
  pull_request:
    branches: ["main"]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node --version
      - run: npm run check
      - run: npm test
